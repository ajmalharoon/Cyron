server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js is generated at container start by docker-entrypoint.sh and
    # must never be cached, or a new CYRON_API_BASE won't take effect.
    location = /env.js {
        add_header Cache-Control "no-store";
    }
}
